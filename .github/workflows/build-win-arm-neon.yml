name: Build Windows ARM64 (neon, v0.5)

on:
  push:
    branches:
      - cherry/v0.5-win-arm64 # push 到该分支即触发,不受默认分支限制
  workflow_dispatch: # 也允许手动触发

permissions:
  contents: read

# neon CLI (@neon-rs/cli) 在 win-arm64 host 上没有预编译 native 模块,跑不起来;
# 而 x64 host 交叉编译 libsql-ffi 的 SQLite (cmake) 到 arm64 又会失败。
# 解法: 在原生 arm64 runner 上跑原生 cargo build (cmake 原生编译 OK),
# 然后手动把 cdylib 组装成 neon 平台包,完全绕开 neon CLI。
jobs:
  build-win-arm64:
    name: Build aarch64-pc-windows-msvc (native, no neon CLI)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: aarch64-pc-windows-msvc-cargo-win11arm-native-v2

      - name: Build native cdylib
        run: cargo build --release
        shell: bash

      - name: Assemble neon platform package
        shell: bash
        run: |
          set -euo pipefail
          test -f target/release/libsql_js.dll
          mkdir -p dist/pkg
          cp target/release/libsql_js.dll dist/pkg/index.node
          cat > dist/pkg/package.json <<'JSON'
          {
            "name": "@cherrystudio/win32-arm64-msvc",
            "description": "Prebuilt binary package for `libsql` on `win32-arm64-msvc`.",
            "version": "0.5.29",
            "os": ["win32"],
            "cpu": ["arm64"],
            "main": "index.node",
            "files": ["index.node"],
            "neon": {
              "type": "binary",
              "rust": "aarch64-pc-windows-msvc",
              "node": "win32-arm64-msvc",
              "platform": "win32",
              "arch": "arm64",
              "abi": "msvc"
            },
            "repository": {
              "type": "git",
              "url": "git+https://github.com/tursodatabase/libsql-js.git"
            },
            "keywords": ["libsql"],
            "license": "MIT",
            "publishConfig": { "access": "public" }
          }
          JSON
          ( cd dist/pkg && npm pack && mv ./*.tgz ../ )
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-aarch64-pc-windows-msvc
          path: dist/*.tgz
          if-no-files-found: error
